<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · Solar Monitor</title><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head><body class="auth-page"><main class="auth-card"><p class="eyebrow">SOLAR MONITOR ADMIN</p><h1>Welcome back</h1><p class="muted">Sign in to manage diagnostics, data, and settings.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><a href="/">Return to dashboard</a></main></body></html>
