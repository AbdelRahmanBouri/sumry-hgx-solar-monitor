<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up admin · Solar Monitor</title><link rel="stylesheet" href="{{ url_for('static', filename='theme.css', v=version('theme.css')) }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css', v=version('admin.css')) }}"></head><body class="auth-page"><main class="auth-card"><p class="eyebrow">ONE-TIME SETUP</p><h1>Create the administrator</h1><p class="muted">This setup link stops working as soon as the account is created.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><label>Username<input name="username" value="admin" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" required></label><label>Confirm password<input type="password" name="confirmation" autocomplete="new-password" minlength="10" required></label><button type="submit">Create administrator</button></form></main></body></html>
