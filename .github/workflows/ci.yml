name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares 3.11 as the floor, so the floor is tested.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Node is optional for the suite: with it on PATH the Python tests also
      # parse every script with V8 and run the charting unit tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m coverage run --branch --source=solar_monitor -m unittest discover -v
      - name: Require coverage of the serial and write boundaries
        run: |
          for module in collector.py change_policy.py propose.py serial_io.py protocols/base.py protocols/sumry_8851.py; do
            python -m coverage report --fail-under=95 --include="solar_monitor/$module"
          done
      - name: Save coverage report
        if: always()
        run: python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
      - run: node --test tests/js/*.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt --format=json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt build
      - run: python -m build
      - name: Check the installed wheel outside the checkout
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/check_package.py"
      - name: Exercise the simulator and render the pages
        run: |
          python run.py --demo > demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat demo.log; exit 1; fi
          python tools/check_demo.py
          python tools/screenshot.py --verify --all --login demo:demo-password --out demo-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-verification
          path: |
            demo.log
            demo-screenshots/
