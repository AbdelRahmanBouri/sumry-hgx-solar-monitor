name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Node is optional for the suite: with it on PATH the Python tests also
      # parse every script with V8 and run the charting unit tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: node --test tests/js/*.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Advisory for now. Once the existing findings are cleared, remove
      # continue-on-error so this step becomes blocking.
      - run: ruff check .
        continue-on-error: true
