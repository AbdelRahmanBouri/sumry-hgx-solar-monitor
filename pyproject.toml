[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-monitor"
version = "0.1.0"
description = "Local-first monitor for a SUMRY HGX inverter on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "pyserial>=3.5,<4",
    "waitress>=3,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "coverage>=7.6,<8", "mypy==1.20.2", "types-pyserial==3.5.0.20260712", "types-waitress==3.0.1.20260724"]

[tool.setuptools]
packages = ["solar_monitor", "solar_monitor.protocols", "solar_monitor.serial_handlers"]
include-package-data = false

[tool.setuptools.package-data]
solar_monitor = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["instance", "captures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # Lines in the protocol tables and the long explanatory comments run
    # past 110 on purpose; the limit above is the target for new code.
    "E501",
    # `zip(rows, rows[1:])` pairs each reading with the next one. The
    # lengths differ by design, so `strict=` would be wrong, not missing.
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["solar_monitor"]
force-sort-within-sections = true

[tool.coverage.report]
precision = 1
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["solar_monitor", "run.py", "diagnostic.py"]
strict = true
warn_unreachable = true
