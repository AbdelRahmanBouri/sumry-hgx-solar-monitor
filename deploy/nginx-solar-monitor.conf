# Reverse proxy for the solar monitor.
#
# This is the default_server on purpose. The dashboard is reached by several
# names -- solar-monitor.local over mDNS at home, the plain hostname or a
# 100.x address over Tailscale, the LAN IP directly -- and a server_name list
# would silently drop whichever one was forgotten. Before this was the
# default, `solar-monitor.local` served the dashboard while every other name
# fell through to nginx's stock welcome page.
#
# Install:
#   sudo cp deploy/nginx-solar-monitor.conf /etc/nginx/sites-available/solar-monitor
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The Pi is small and the dashboard polls often; keep responses cheap.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
